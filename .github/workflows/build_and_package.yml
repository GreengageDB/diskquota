# .github/workflows/build_and_package.yml
name: Build and Package DEB

on:
  push:
    branches: ['main']
    tags: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: ubuntu
            target_os_version: '22.04'
            gp_version: 6
          - target_os: ubuntu
            target_os_version: '24.04'
            gp_version: 6
          - target_os: ubuntu
            target_os_version: '22.04'
            gp_version: 7
    runs-on: ubuntu-24.04
    env:
      GGDB_IMAGE:   ghcr.io/greengagedb/greengage/ggdb${{ matrix.gp_version}}_${{ matrix.target_os}}${{ matrix.target_os_version != '22.04' && matrix.target_os_version || '' }}:latest
      DEB_PACKAGES: deb-packages-greengage${{ matrix.gp_version }}-diskquota-${{ matrix.target_os }}${{ matrix.target_os_version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Build in Docker using docker run
        env:
          PG_HOME: /opt/greengagedb/greengage${{ matrix.gp_version }}
          SRC: /home/gpadmin/diskquota
          PATH: /opt/greengagedb/greengage${{ matrix.gp_version }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          GP_MAJORVERSION: ${{ matrix.gp_version }}

        run: |
          set -eux
          docker run \
            --rm \
            -v ${{ github.workspace }}:$SRC \
            -w $SRC \
            -e PG_HOME \
            -e SRC \
            -e PATH \
            -e GP_MAJORVERSION \
            $GGDB_IMAGE \
            /bin/bash ci/build_in_docker.sh

          mv Package $DEB_PACKAGES

      - name: Upload deb packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DEB_PACKAGES }}
          path: ${{ env.DEB_PACKAGES }}

      - name: Test install deb-packages in Docker 
        uses: greengagedb/greengage-ci/.github/actions/tests/install/deb@v45
        with:
          test_docker: ${{ matrix.target_os}}:${{ matrix.target_os_version }}
          artifact_name: ${{ env.DEB_PACKAGES }}
          verify_commands: dpkg -l greengage${{ matrix.gp_version }}-diskquota
